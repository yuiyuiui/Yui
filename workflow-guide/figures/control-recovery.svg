<svg aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="464" height="280" viewBox="0 0 464 280" role="img"><title id="title">Faults and recovery</title><desc id="desc">Arrows run from labeled output ports to their receivers. Dashed arrows return to the same or an earlier column.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526679" /></marker></defs><rect x="0" y="0" width="464" height="280" fill="#f4f7f8" rx="9" /><g fill="none" stroke="#526679" stroke-width="1.6" stroke-linejoin="round"><path d="M200 172 C232 172 232 98 262 98" marker-end="url(#arrow)" data-source="running" data-port="fault" data-target="paused" /><path d="M438 131 H450 V37 H12 V143 H24" marker-end="url(#arrow)" data-source="paused" data-port="resume" data-target="running" stroke-dasharray="5 3" /><path d="M200 187 C232 187 232 215 262 215" marker-end="url(#arrow)" data-source="running" data-port="unknown effect" data-target="uncertain" /><path d="M438 248 H454 V25 H8 V169 H24" marker-end="url(#arrow)" data-source="uncertain" data-port="settle" data-target="running" stroke-dasharray="5 3" /></g><g data-node="running" font-family="Inter, Arial, sans-serif"><title>Running · Execute block</title><rect x="26" y="109" width="174" height="94" rx="8" fill="white" stroke="#bac8ce" /><rect x="37" y="121" width="4" height="10" rx="2" fill="#345564" /><text x="46" y="130" fill="#345564" font-size="10" font-weight="700" letter-spacing="1">RUNNING</text><text x="38" y="152" fill="#172e3c" font-size="16" font-weight="600">Execute block</text><text x="188" y="176" fill="#3d5362" font-size="12" text-anchor="end">fault</text><circle cx="200" cy="172" r="2.8" fill="#345564" /><text x="188" y="191" fill="#3d5362" font-size="12" text-anchor="end">unknown effect</text><circle cx="200" cy="187" r="2.8" fill="#345564" /></g><g data-node="paused" font-family="Inter, Arial, sans-serif"><title>Paused · Inspect diagnostic</title><rect x="264" y="48" width="174" height="99" rx="8" fill="white" stroke="#bac8ce" /><rect x="275" y="60" width="4" height="10" rx="2" fill="#345564" /><text x="284" y="69" fill="#345564" font-size="10" font-weight="700" letter-spacing="1">PAUSED</text><text x="276" y="91" fill="#172e3c" font-size="16" font-weight="600">Inspect</text><text x="276" y="111" fill="#172e3c" font-size="16" font-weight="600">diagnostic</text><text x="426" y="135" fill="#3d5362" font-size="12" text-anchor="end">resume</text><circle cx="438" cy="131" r="2.8" fill="#345564" /></g><g data-node="uncertain" font-family="Inter, Arial, sans-serif"><title>Operator · Reconcile effect</title><rect x="264" y="165" width="174" height="99" rx="8" fill="white" stroke="#bac8ce" /><rect x="275" y="177" width="4" height="10" rx="2" fill="#95531c" /><text x="284" y="186" fill="#95531c" font-size="10" font-weight="700" letter-spacing="1">OPERATOR</text><text x="276" y="208" fill="#172e3c" font-size="16" font-weight="600">Reconcile</text><text x="276" y="228" fill="#172e3c" font-size="16" font-weight="600">effect</text><text x="426" y="252" fill="#3d5362" font-size="12" text-anchor="end">settle</text><circle cx="438" cy="248" r="2.8" fill="#95531c" /></g></svg>

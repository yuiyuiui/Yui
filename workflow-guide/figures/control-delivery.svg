<svg aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="654" height="248" viewBox="0 0 654 248" role="img"><title id="title">Delivery, cancellation and cleanup</title><desc id="desc">Arrows run from labeled output ports to their receivers. Dashed arrows return to the same or an earlier column.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526679" /></marker></defs><rect x="0" y="0" width="654" height="248" fill="#f4f7f8" rx="9" /><g fill="none" stroke="#526679" stroke-width="1.6" stroke-linejoin="round"><path d="M192 99 C216 99 216 66 238 66" marker-end="url(#arrow)" data-source="exit" data-port="verified publish" data-target="done" /><path d="M192 196 C216 196 216 183 238 183" marker-end="url(#arrow)" data-source="active" data-port="cancel" data-target="cancelled" /><path d="M414 99 C438 99 438 116 460 116" marker-end="url(#arrow)" data-source="done" data-port="clean" data-target="clean" /><path d="M414 216 C438 216 438 132 460 132" marker-end="url(#arrow)" data-source="cancelled" data-port="clean" data-target="clean" /></g><g data-node="exit" font-family="Inter, Arial, sans-serif"><title>Exit · Business exit</title><rect x="18" y="36" width="174" height="79" rx="8" fill="white" stroke="#bac8ce" /><rect x="29" y="48" width="4" height="10" rx="2" fill="#166662" /><text x="38" y="57" fill="#166662" font-size="10" font-weight="700" letter-spacing="1">EXIT</text><text x="30" y="79" fill="#172e3c" font-size="16" font-weight="600">Business exit</text><text x="180" y="103" fill="#3d5362" font-size="12" text-anchor="end">verified publish</text><circle cx="192" cy="99" r="2.8" fill="#166662" /></g><g data-node="active" font-family="Inter, Arial, sans-serif"><title>Run · Unfinished run</title><rect x="18" y="133" width="174" height="79" rx="8" fill="white" stroke="#bac8ce" /><rect x="29" y="145" width="4" height="10" rx="2" fill="#345564" /><text x="38" y="154" fill="#345564" font-size="10" font-weight="700" letter-spacing="1">RUN</text><text x="30" y="176" fill="#172e3c" font-size="16" font-weight="600">Unfinished run</text><text x="180" y="200" fill="#3d5362" font-size="12" text-anchor="end">cancel</text><circle cx="192" cy="196" r="2.8" fill="#345564" /></g><g data-node="done" font-family="Inter, Arial, sans-serif"><title>Delivery · Completed receipt</title><rect x="240" y="16" width="174" height="99" rx="8" fill="white" stroke="#bac8ce" /><rect x="251" y="28" width="4" height="10" rx="2" fill="#166662" /><text x="260" y="37" fill="#166662" font-size="10" font-weight="700" letter-spacing="1">DELIVERY</text><text x="252" y="59" fill="#172e3c" font-size="16" font-weight="600">Completed</text><text x="252" y="79" fill="#172e3c" font-size="16" font-weight="600">receipt</text><text x="402" y="103" fill="#3d5362" font-size="12" text-anchor="end">clean</text><circle cx="414" cy="99" r="2.8" fill="#166662" /></g><g data-node="cancelled" font-family="Inter, Arial, sans-serif"><title>Delivery · Cancelled receipt</title><rect x="240" y="133" width="174" height="99" rx="8" fill="white" stroke="#bac8ce" /><rect x="251" y="145" width="4" height="10" rx="2" fill="#166662" /><text x="260" y="154" fill="#166662" font-size="10" font-weight="700" letter-spacing="1">DELIVERY</text><text x="252" y="176" fill="#172e3c" font-size="16" font-weight="600">Cancelled</text><text x="252" y="196" fill="#172e3c" font-size="16" font-weight="600">receipt</text><text x="402" y="220" fill="#3d5362" font-size="12" text-anchor="end">clean</text><circle cx="414" cy="216" r="2.8" fill="#166662" /></g><g data-node="clean" font-family="Inter, Arial, sans-serif"><title>Cleanup · Keep delivery</title><rect x="462" y="92" width="174" height="64" rx="8" fill="white" stroke="#bac8ce" /><rect x="473" y="104" width="4" height="10" rx="2" fill="#345564" /><text x="482" y="113" fill="#345564" font-size="10" font-weight="700" letter-spacing="1">CLEANUP</text><text x="474" y="135" fill="#172e3c" font-size="16" font-weight="600">Keep delivery</text></g></svg>
